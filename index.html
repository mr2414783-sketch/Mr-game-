<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Party</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#262626;--panel:#FFFFFF;--panel-2:#FAFAFA;--blue:#0095F6;--blue-dim:#1877F2;--red:#ED4956;--green:#3F9142;--mut:#737373;--line:rgba(0,0,0,.09)}
*{box-sizing:border-box}
html{background:var(--panel-2)}
html[data-theme="dark"]{filter:invert(1) hue-rotate(180deg)}
html[data-theme="dark"] img,html[data-theme="dark"] .logo-tile{filter:invert(1) hue-rotate(180deg)}
body{margin:0;color:var(--ink);font:600 15px/1.5 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;justify-content:center}
.board{width:100%;max-width:560px;background:var(--panel);min-height:100vh;box-shadow:0 0 24px rgba(0,0,0,.06)}
.header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:10px;letter-spacing:.1em;color:#8e8e8e;text-transform:uppercase;font-weight:700}
.app-logo{display:flex;align-items:center;gap:9px}
.app-logo-icon{width:30px;height:30px;border-radius:9px;flex-shrink:0;background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF,#515BD4);display:flex;align-items:center;justify-content:center}
.app-logo-icon svg{width:18px;height:18px;display:block}
.title{font-weight:800;font-size:19px;letter-spacing:.01em;background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF,#515BD4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gate{text-align:right}.gate .label{font-size:9px;letter-spacing:.1em;color:#8e8e8e;font-weight:700}.gate .val{font-size:12px;font-weight:800;color:var(--ink)}
#app{padding:18px 16px 28px}
h1,h2{font-weight:800;margin:.2em 0 .3em}
h1{font-size:26px;line-height:1.15}h2{font-size:20px}
p{margin:.4em 0;color:var(--mut);font-weight:600}
.home-title{text-align:center;margin-top:10px}
.home-sub{text-align:center;color:var(--blue-dim);font-size:14px;margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{margin-top:0}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:13px 16px;background:var(--ink);color:#fff;width:100%;margin:6px 0;cursor:pointer;transition:transform .1s,opacity .15s}
button:active{transform:scale(.98)}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.a{background:var(--blue);color:#fff}
button:disabled{opacity:.4}
textarea,input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid button{margin:0;padding:11px 8px;font-size:14px}
.sel{background:rgba(0,149,246,.1)!important;color:var(--blue-dim)!important;border-color:var(--blue)!important}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--blue);color:#fff}
.big{font-size:44px;font-weight:800;text-align:center;line-height:1.15;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.cnt{display:flex;align-items:center;gap:8px}.cnt b{min-width:24px;text-align:center}.cnt button{width:42px;margin:0;padding:8px}
.hold{user-select:none;-webkit-user-select:none;touch-action:none;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;border:2px dashed var(--blue)}
.err{color:var(--red)}
.role{border-radius:20px 20px 4px 20px}
/* tombol game besar di layar utama */
.game-card{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;margin:14px 0;padding:22px 16px 20px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:28px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.game-card.ww{border-color:rgba(143,123,255,.5)}
.game-card.mw{border-color:rgba(38,38,38,.28)}
.game-card.tod{border-color:rgba(237,73,86,.45)}
.todf{display:block;width:100%;height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:520px;border:1px solid var(--line);border-radius:18px;background:#fff;margin-top:8px}
body.fs .header,body.fs #installBar{display:none!important}
body.fs .board{box-shadow:none;max-width:none}
body.fs #app{max-width:560px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top))}
body.fs-tod #app{max-width:none;padding:0}
.todbar{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 10px 0;height:calc(46px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.todbar button{width:auto;margin:0;padding:7px 14px;font-size:13px;border-radius:10px}
.todbar b{font-size:14px}
body.fs-tod .todf{position:fixed;left:0;top:calc(46px + env(safe-area-inset-top));width:100%;height:calc(100vh - 46px - env(safe-area-inset-top));height:calc(100dvh - 46px - env(safe-area-inset-top));min-height:0;border:0;border-radius:0;margin:0;z-index:50}
html[data-theme="dark"] .todf{filter:invert(1) hue-rotate(180deg)}
.logo-tile{width:104px;height:104px;border-radius:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.logo-tile svg{width:78px;height:78px;display:block}
.gc-title{font-size:26px;font-weight:800;line-height:1.2}
.gc-sub{font-size:12px;color:var(--mut);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* alur baru */
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.18);flex-shrink:0;line-height:1}
.rlogo{display:inline-flex;align-items:center;justify-content:center;border-radius:28%;flex-shrink:0;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.rlogo svg{width:78%;height:78%;display:block}
.rhead{display:flex;align-items:center;gap:12px}
.rname{font-size:19px;display:block;margin-bottom:3px}
.rtext{color:var(--ink);font-size:14px;line-height:1.6;font-weight:600;margin:10px 0 0;text-align:left}
.rh{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0}
button.bigb{padding:20px 16px;font-size:18px;border-radius:18px;margin:10px 0}
.cntbox{display:flex;align-items:center;justify-content:center;gap:18px}
.cntbox input{width:120px;font-size:38px;font-weight:800;text-align:center;padding:8px}
.cntbox .chb{width:56px;margin:0;padding:12px;font-size:22px}
.cntp{text-align:center;font-size:13px;margin:6px 0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.pcard{perspective:700px;height:152px;position:relative}
.pin{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.pcard.flipped .pin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.face.back{transform:rotateY(180deg)}
.pcard button{margin:0;padding:7px 4px;font-size:12px;border-radius:10px}
.pick .face.back{background:linear-gradient(135deg,#262626,#515BD4);color:#fff;border:0}
.lock{font-size:30px}
.bc{cursor:pointer}
.pn{font-size:12px;font-weight:800;text-align:center;word-break:break-word;line-height:1.2}
.rn{font-size:11px;font-weight:800;text-align:center;line-height:1.15}
.skull{position:absolute;top:4px;right:6px;font-size:19px;display:none}
.dead .skull{display:block}
.dead .face{filter:grayscale(.55)}
.gx{display:flex;align-items:center;gap:10px}
.gx button.sm{width:auto;margin:0;padding:7px 14px;font-size:12px;border-radius:10px}
.pickrole{cursor:pointer}
.pickrole.off{opacity:.4;cursor:not-allowed}
.qd{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.qbox{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:360px;text-align:center}
/* revisi */
.qd{overflow:auto}.qbox{max-height:92vh;overflow:auto}
.xw{position:relative;display:block}.xs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.xs line{stroke:#ED4956;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:xd .45s ease-out .35s forwards}.xs line.l2{animation-delay:.8s}
@keyframes xd{to{stroke-dashoffset:0}}
.zin{animation:zi .4s cubic-bezier(.2,1.3,.4,1)}@keyframes zi{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="board">
  <div class="header">
    <div class="brand">
      <div class="eyebrow">Satu HP · Main Bareng</div>
      <div class="app-logo">
        <div class="app-logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="12" r="1" fill="#fff"/><circle cx="18.5" cy="14.5" r="1" fill="#fff"/></svg></div>
        <div class="title">Game Party</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px"><div class="gate"><div class="label">STATUS</div><div class="val" id="statusVal">PILIH GAME</div></div><button id="langBtn" title="Language / Bahasa" style="width:auto;margin:0;padding:7px 11px;font-size:12px;border-radius:10px">EN</button></div>
  </div>
  <div id="installBar" style="display:none;padding:9px 16px;background:rgba(0,149,246,.08);border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;gap:10px">
    <span style="font-size:12px;font-weight:700;color:var(--blue-dim)">📲 Pasang app ini ke Home Screen biar gampang dibuka lagi</span>
    <button id="installBtn" style="width:auto;margin:0;padding:8px 14px;font-size:12px;flex-shrink:0;background:var(--blue)">Pasang</button>
  </div>
  <div id="app"></div>
</div>
<script>const TOD_SRC="<!doctype html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#ffffff\">\n<title>Truth or Dare<\/title>\n<style>\n:root{--bg:#fff;--ink:#111;--mut:#6b6b6b;--panel:#f3f4f6;--line:rgba(0,0,0,.12);--blue:#0095F6;--red:#ED4956;--ok:#1ba94c;--gold:#f5a623}\nhtml[data-theme=dark]{--bg:#000;--ink:#f2f2f2;--mut:#a8a8a8;--panel:#1c1c1e;--line:rgba(255,255,255,.16);color-scheme:dark}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;min-height:100dvh}\nheader{max-width:480px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}\nheader b{font-size:15px;letter-spacing:.3px}\nheader div{display:flex;gap:6px}\n#app{max-width:480px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}\nh1{font-size:28px;margin:8px 0 4px}\nh2{font-size:20px;margin:16px 0 8px}\np{margin:6px 0}\n.sub{color:var(--mut);font-size:14px;text-align:center}\n.name{text-align:center;font-size:40px;margin:4px 0 20px;word-break:break-word}\nbutton{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px 16px;background:var(--panel);color:var(--ink);cursor:pointer;width:100%;margin-top:10px;transition:transform .1s,opacity .2s}\nbutton:active{transform:scale(.97)}\nbutton:disabled{opacity:.4;cursor:not-allowed}\nbutton.a{background:var(--blue);color:#fff}\nbutton.r{background:var(--red);color:#fff}\nbutton.g{background:transparent;border:1px solid var(--line)}\nbutton.sm{width:auto;margin:0;padding:7px 11px;font-size:13px;border-radius:10px}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.row2 button{margin-top:0}\n.big{padding:42px 10px;font-size:22px;border-radius:20px}\n.card{background:var(--panel);border-radius:20px;padding:20px;margin-top:12px}\n.q{font-size:22px;line-height:1.35;text-align:center;font-weight:600;margin:14px 0;min-height:110px;display:flex;align-items:center;justify-content:center}\n.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}\n.badge.t{background:var(--blue)}.badge.d{background:var(--red)}.badge.s{background:var(--gold)}\n.center{text-align:center}\ninput[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}\n.prow{display:flex;gap:8px;margin-top:8px}\n.prow button{width:auto;margin:0;padding:0 14px}\n.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}\n.chip{width:auto;margin:0;padding:9px 14px;border-radius:99px;font-size:14px;background:var(--panel);border:2px solid transparent}\n.chip.on{border-color:var(--blue);background:rgba(0,149,246,.14)}\nlabel.opt{display:flex;align-items:center;gap:10px;margin-top:10px}\nlabel.opt input{width:20px;height:20px}\n.score{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;justify-content:center}\n.score span{background:var(--panel);border-radius:99px;padding:5px 11px;font-size:13px}\n.score span.cur{outline:2px solid var(--blue)}\n.timer{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}\n.timer.low{color:var(--red)}\n.flip{animation:flip .5s ease}\n@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}\n.pun{font-size:24px;font-weight:700;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center}\n.title{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:14px;margin-top:10px}\n.title .e{font-size:30px}\n@property --cx{syntax:'<length>';inherits:true;initial-value:0px}\n@property --cy{syntax:'<length>';inherits:true;initial-value:0px}\n@property --vx{syntax:'<length>';inherits:true;initial-value:0px}\n@property --vy{syntax:'<length>' turn;\n const f=t=>{if(!$('#vp')||!$('#prev')){PVR=0;return}\n  camSet(C,C,1,false,Math.sin(t/2400)*18);\n  const b=Math.sin(t/500)*5;coinPlace(C,C-14-b,1,1,'truth',C,C,Math.min(1,(14+b)/300),t/700);\n  PVR=requestAnimationFrame(f)};\n PVR=requestAnimationFrame(f)}\n\n/* ============ setup ============ */\nfunction setup(){\n show(`<h1>🎭 ${LANG=='id'?'Jujur atau Berani':'Truth or Dare'}<\/h1><p class=sub style=\"text-align:left\">${t('tag')}<\/p>\n <h2>${t('players')} <span class=sub id=cnt><\/span><\/h2><div id=pl><\/div>\n <button class=g onclick=addP()>${t('add')}<\/button>\n <p class=sub style=\"text-align:left;margin-top:8px\">${t('tapAv')}<\/p>\n <h2>${t('levels')}<\/h2><div class=chips>${['easy','fun','spicy'].map(l=>`<button class=\"chip ${S.lvls.includes(l)?'on':''}\" onclick=\"togLv('${l}')\">${t('lv_'+l)}<\/button>`).join('')}<\/div>\n <h2>${t('opts')}<\/h2>\n <label class=opt><input type=checkbox ${S.coin?'checked':''} onchange=\"S.coin=this.checked;save()\">${t('coinSide')}<\/label>\n <label class=opt><input type=checkbox ${S.timer?'checked':''} onchange=\"S.timer=this.checked;save()\">${t('timer')}<\/label>\n <label class=opt><input type=checkbox ${S.vote?'checked':''} onchange=\"S.vote=this.checked;save()\">${t('vote')}<\/label>\n <label class=opt><input type=checkbox ${S.rand?'checked':''} onchange=\"S.rand=this.checked;save()\">${t('rand')}<\/label>\n <h2>${t('table')}<\/h2><div id=prev><\/div>\n <p id=err class=center style=\"color:var(--red);min-height:22px\"><\/p>\n <button class=a onclick=startGame()>${t('start')}<\/button>`);\n drawPl();drawPrev();\n}\nfunction drawPl(){\n $('#pl').innerHTML=S.names.map((n,i)=>{const a=avOf(n,S.gen[i]);\n  return `<div class=prow><button class=\"avb ${a.g}\" id=avb${i} onclick=\"togG(${i})\" aria-label=\"gender\">${a.e}<i>⇄<\/i><\/button><input type=text maxlength=14 placeholder=\"${t('ph')} ${i+1}\" value=\"${esc(n)}\" oninput=\"nameIn(${i},this.value)\" onkeydown=\"if(event.key=='Enter'){event.preventDefault();enterKey(${i})}\">${S.names.length>2?`<button class=g onclick=\"delP(${i})\" aria-label=\"x\">✕<\/button>`:''}<\/div>`}).join('');\n}\nfunction updAv(i){const a=avOf(S.names[i],S.gen[i]),b=$('#avb'+i);if(b){b.innerHTML=a.e+'<i>⇄<\/i>';b.className='avb '+a.g}}\nfunction nameIn(i,v){S.names[i]=v;save();updAv(i);drawPrev()}\nfunction togG(i){const k=(S.names[i]||'').trim().toLowerCase();if(!k)return;S.gmap[k]=avOf(S.names[i]).g=='f'?'m':'f';save();S.names.forEach((_,j)=>updAv(j));drawPrev()}\nfunction enterKey(i){const ins=document.querySelectorAll('#pl input');if(i<ins.length-1)ins[i+1].focus();else addP()}\nfunction drawPrev(){const L=curList(),el=$('#prev');if(!el)return;$('#cnt').textContent=L.length+'/'+MAXP;\n if(!L.length){el.innerHTML=`<p class=sub>${t('fillNames')}<\/p>`;return}\n el.innerHTML=stageHTML(L);el.classList.add('prev-hint');el.querySelectorAll('.pl').forEach(d=>d.onclick=()=>togG(+d.dataset.i));camSet(C,C,1,false);pvStart()}\nfunction addP(){if(S.names.length<MAXP){S.names.push('');S.gen.length=S.names.length-1;save();drawPl();const i=document.querySelectorAll('#pl input');i[i.length-1].focus()}}\nfunction delP(i){S.names.splice(i,1);S.gen.splice(i,1);save();drawPl();drawPrev()}\nfunction togLv(l){const i=S.lvls.indexOf(l);i>=0?S.lvls.splice(i,1):S.lvls.push(l);save();setup()}\nfunction startGame(){\n const P=[];S.names.forEach((x,i)=>{x=x.trim();if(x){const a=avOf(x,S.gen[i]);P.push({n:x,g:a.g,e:a.e,done:0,skip:0,lie:0,q:2,sh:0})}});\n if(P.length<2){$('#err').textContent=t('need');return}\n if(!S.lvls.length){$('#err').textContent=t('lvNeed');return}\n G={p:P,turn:rnd(P.length),prev:null,used:{},card:null};SFX.start();\n try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}\n go(tossView);\n}\n\n/* ============ giliran ============ */\nfunction scoreBar(hide){return `<div class=score>${G.p.map((p,i)=>`<span class=\"${i==G.turn&&!hide?'cur':''}\">${esc(p.n)} ✅${p.done} ⏭️${p.skip}${p.sh?' 🛡️'+p.sh:''}<\/span>`).join('')}<\/div>`}\nfunction turnView(){\n const p=G.p[G.turn];\n show(`<p class=sub style=\"margin-top:20px\">${t('turn')}<\/p><h1 class=name>${esc(p.n)}<\/h1>\n <div class=row2><button class=\"big a\" onclick=\"pick('truth')\">${t('truth')}<\/button><button class=\"big r\" onclick=\"pick('dare')\">${t('dare')}<\/button><\/div>\n ${scoreBar()}<button class=g onclick=endGame()>${t('end')}<\/button>`);\n}\nfunction nextTurn(){\n const n=G.p.length;G.prev=G.turn;\n if(S.rand&&n>1){let k;do{k=rnd(n)}while(k==G.turn);G.turn=k}else G.turn=(G.turn+1)%n;   // searah jarum jam\n go(tossView);\n}\nfunction tossView(){\n clearTimers();VIEW=()=>{};\n const N=G.p.length,tgt=G.turn,side=Math.random()<.5?'truth':'dare',s=avSz(N);\n show(`<p class=sub id=tl>${t('tossing')}<\/p>${stageHTML(G.p)}<div id=act><\/div>${scoreBar(true)}<button class=g onclick=endGame()>${t('end')}<\/button>`);\n const from=pt(G.prev==null?0:G.prev,N,RP),[lx,ly]=pt(tgt,N,RT-CS/2-6),[cx,cy]=pt(tgt,N,(RT-CS/2-6+RP)/2),zT=s>=50?1.9:2.3;\n camSet(from[0],from[1],2.3,false,yawTo(G.prev==null?0:G.prev,N));coinPlace(C,C,1,1,'truth',C,C,0,0);       // mulai dekat pemain\n $('#world').offsetWidth;\n later(()=>{camSet(C,C,1,true);SFX.whoosh(.8)},350);                                        // kamera menjauh\n later(()=>{SFX.throwUp();const t0=performance.now();let zoomed=false,lf='truth';\n  const step=now=>{\n   const u=Math.min(1,(now-t0)/3000),m=Math.min(1,u/.8),e=m*m*(3-2*m);\n   let h=Math.sin(Math.PI*m)*300,sc=1+1.7*Math.sin(Math.PI*m);\n   if(u>.8){const v=(u-.8)/.2;h=Math.abs(Math.sin(v*Math.PI*2))*(1-v)*20;sc=1}\n   const th=Math.PI*(14+(side=='dare'?1:0))*(1-Math.pow(1-m,3)),cs=Math.cos(th);\n   const bx=C+(lx-C)*e,by=C+(ly-C)*e;\n   const fc=cs>=0?'truth':'dare';if(fc!==lf&&u<.8)SFX.flip();lf=fc;\n   coinPlace(bx,by-h,sc,Math.max(.06,Math.abs(cs)),fc,bx,by,Math.min(1,h/300),th);\n   if(u>.55&&!zoomed){zoomed=true;camSet(cx,cy,zT,true,yawTo(tgt,N)-50);SFX.whoosh(.6)}                 // kamera mendekat ke pemain\n   if(u<1)RAF=requestAnimationFrame(step);else{buzz(80);SFX.land();later(()=>SFX.reveal(side),450);VIEW=landUI;landUI()}\n  };RAF=requestAnimationFrame(step)},1700);\n function landUI(){\n  const p=G.p[tgt],h=$('#pl'+tgt);if(h)h.classList.add('hot');\n  $('#tl').innerHTML=`${esc(p.n)} · <b>${t(side)}<\/b>`;\n  $('#ov').innerHTML=`<span class=\"sd ${side}\">${t(side)}<\/span>`;\n  $('#act').innerHTML=S.coin?`<button class=a onclick=\"pick('${side}')\">${t('see')}<\/button>`:`<div class=row2 style=\"margin-top:10px\"><button class=\"a\" onclick=\"pick('truth')\">${t('truth')}<\/button><button class=\"r\" onclick=\"pick('dare')\">${t('dare')}<\/button><\/div>`;\n }\n}\nfunction draw(type){\n const lv=S.lvls[rnd(S.lvls.length)],key=type+lv,len=D[LANG][type][lv].length;\n let used=G.used[key]||(G.used[key]=[]);\n let av=[];for(let i=0;i<len;i++)if(!used.includes(i))av.push(i);\n if(!av.length){used.length=0;for(let i=0;i<len;i++)av.push(i)}\n const i=av[rnd(av.length)];used.push(i);\n return {type,lv,i};\n}\nfunction pick(type){\n buzz(30);\n if(Math.random()<0.1){const s=['swap','all','victim','shield'][rnd(4)];return special(s)}\n G.card=draw(type);go(cardView);\n}\n\n/* ============ kartu ============ */\nfunction cardView(){\n const p=G.p[G.turn],c=G.card,text=D[LANG][c.type][c.lv][c.i];\n const tm=(c.type=='dare'&&S.timer)?`<div class=timer id=tm>0:30<\/div><button class=g id=tmb onclick=startTm()>${t('startTimer')}<\/button>`:'';\n let acts;\n if(c.all)acts=`<button class=a onclick=doneAll()>${t('done')}<\/button>`;\n else{\n  let sk;\n  if(p.sh>0)sk=`<button class=g onclick=doSkip()>${t('shield')}<\/button>`;\n  else if(p.q>0)sk=`<button class=g onclick=doSkip()>${t('skipLeft',{n:p.q})}<\/button>`;\n  else sk=`<button class=g disabled>${t('noSkip')}<\/button>`;\n  acts=`<button class=a onclick=doDone()>${t('done')}<\/button>${sk}`;\n }\n show(`<p class=sub>${c.all?'':esc(p.n)}${c.by?` · ${t('by')} ${esc(c.by)}`:''}<\/p>\n <div class=\"card center\"><span class=\"badge ${c.type=='truth'?'t':'d'}\">${t(c.type)}<\/span> <span class=sub>${t('lv_'+c.lv)}<\/span>\n <div class=q>${esc(text)}<\/div>${tm}<\/div>${acts}`,true);\n}\nfunction startTm(){\n let s=30;const el=$('#tm');$('#tmb').disabled=true;buzz(30);\n TM=setInterval(()=>{s--;const e=$('#tm');if(!e){clearInterval(TM);return}\n  e.textContent=s>0?'0:'+String(s).padStart(2,'0'):t('timeUp');e.classList.toggle('low',s<=5);if(s>0&&s<=5)SFX.beep();if(s<=0)SFX.alarm();\n  if(s<=0){clearInterval(TM);buzz(500)}},1000);\n}\nfunction doDone(){\n SFX.ok();const c=G.card;\n if(c.type=='truth'&&S.vote&&G.p.length>2)return go(voteView);\n G.p[G.turn].done++;nextTurn();\n}\nfunction doneAll(){SFX.ok();G.p.forEach(p=>p.done++);nextTurn()}\nfunction doSkip(){\n SFX.skip();const p=G.p[G.turn];\n if(p.sh>0){p.sh--;nextTurn();return}\n p.q--;p.skip++;go(punView);\n}\nfunction voteView(){\n show(`<p class=sub>${esc(G.p[G.turn].n)}<\/p><div class=\"card center\"><div class=q>${t('voteQ')}<\/div><\/div>\n <div class=row2 style=\"margin-top:12px\"><button class=a onclick=vote(0)>${t('believe')}<\/button><button class=r onclick=vote(1)>${t('lie')}<\/button><\/div>`);\n}\nfunction vote(liar){\n const p=G.p[G.turn];\n if(liar){SFX.liar();p.lie++;go(punView)}else{SFX.ok();p.done++;nextTurn()}\n}\n\n/* ============ hukuman ============ */\nfunction punView(){\n const list=PUN[LANG],final=rnd(list.length);\n show(`<p class=sub>${esc(G.p[G.turn].n)}<\/p><div class=\"card center\"><span class=\"badge d\">${t('punTitle')}<\/span><div class=pun id=pt>🎲<\/div><\/div>\n <button class=a id=pn disabled onclick=nextTurn()>${t('next')}<\/button>`,true);\n let n=0;\n SP=setInterval(()=>{const e=$('#pt');if(!e){clearInterval(SP);return}\n  n++;if(n<10){e.textContent=list[rnd(list.length)];SFX.tick(n)}else{clearInterval(SP);e.textContent=list[final];$('#pn').disabled=false;buzz(80);SFX.buzzer()}},110);\n}\n\n/* ============ kartu spesial ============ */\nfunction special(s){SFX.special();\n const p=G.p[G.turn];\n const head=`<p class=sub>${esc(p.n)}<\/p><div class=\"card center\"><span class=\"badge s\">${t('sp_'+s)}<\/span><div class=q>${t('sp_'+s+'_d')}<\/div><\/div>`;\n const others=()=>G.p.map((q,i)=>i==G.turn?'':`<button class=g onclick=\"pickOther(${i},'${s}')\">${esc(q.n)}<\/button>`).join('');\n if(s=='shield'){p.sh++;go(()=>show(head+`<button class=a onclick=nextTurn()>${t('next')}<\/button>`,true));buzz(60);return}\n if(s=='all'){G.card=Object.assign(draw('dare'),{all:true});go(()=>{cardView()});return}\n go(()=>show(head+others(),true));\n}\nfunction pickOther(i,s){\n if(s=='swap'){G.prev=G.turn;G.turn=i;go(tossView);return}\n const by=G.p[G.turn].n;G.turn=i;G.card=Object.assign(draw('dare'),{by});go(cardView);\n}\n\n/* ============ hasil ============ */\nfunction endGame(){\n if($('#cfm'))return;\n const d=document.createElement('div');d.id='cfm';\n d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50';\n d.innerHTML=`<div style=\"background:var(--bg);color:var(--ink);border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center\"><p style=\"font-size:18px;font-weight:600;margin:0 0 6px\">${t('endQ')}<\/p><button class=r id=cy>${t('endYes')}<\/button><button class=g id=cn>${t('cancel')}<\/button><\/div>`;\n document.body.appendChild(d);\n $('#cy').onclick=()=>{d.remove();go(resultView)};\n $('#cn').onclick=()=>d.remove();\n}\nfunction resultView(){SFX.win();\n const top=(k,min)=>{let b=null;G.p.forEach(p=>{if(p[k]>=min&&(!b||p[k]>b[k]))b=p});return b};\n const rows=[['🦁',t('t_brave'),top('done',1),'done'],['🙈',t('t_skip'),top('skip',1),'skip'],['🤥',t('t_liar'),top('lie',1),'lie']];\n show(`<h1 class=center>🏆 ${t('results')}<\/h1>\n ${rows.map(r=>`<div class=title><span class=e>${r[0]}<\/span><div><b>${r[1]}<\/b><br>${r[2]?esc(r[2].n)+' · '+r[2][r[3]]+'×':'<span class=sub>'+t('nobody')+'<\/span>'}<\/div><\/div>`).join('')}\n <h2>${t('score')}<\/h2>${scoreBar().replace('class=score','class=score style=\"justify-content:flex-start\"')}\n <button class=a onclick=again()>${t('again')}<\/button><button class=g onclick=\"go(setup)\">${t('menu')}<\/button>`);\n}\nfunction again(){G.p.forEach(p=>{p.done=p.skip=p.lie=p.sh=0;p.q=2});G.used={};G.turn=rnd(G.p.length);G.prev=null;go(tossView)}\n\n/* ============ init ============ */\nsetTheme(ls.get('todTheme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));\nsetLang(LANG);\ngo(setup);\n<\/script>\n<\/body>\n<\/html>\n";</script>

const SW=['werewolf','alpha','cub'],isW=r=>RL[r][1]=='W',isWN=p=>isW(p.role)||(p.role=='orphan'&&p.parent!==null&&!!G.p[p.parent]&&!G.p[p.parent].alive),TM={W:'Wolf Team',V:'Village',N:'Neutral'};
function wwRoles(){R(`<button class=g onclick=Menu()>Kembali</button><h2>17 peran Werewolf</h2><p>Orphan dan Sick Person hanya muncul di 9 pemain ke atas. Sekitar 1 serigala untuk tiap 4 pemain.</p>${Object.keys(RL).map(k=>`<div class=card><b>${RL[k][0]}</b> <span class=tag>${TM[RL[k][1]]}</span><p>${RL[k][2]}</p></div>`).join('')}`)}
function deal(n){const w=Math.max(1,Math.round(n/4)),wr=['werewolf'];
 if(n>=9&&w>1)wr.push('alpha');if(n>=15&&w>2)wr.push('cub');if(n>=15&&w>3)wr.push('minion');while(wr.length<w)wr.push('werewolf');

function wwSetup(){names(5,40,wwStart,'Werewolf','<p>Host (pemegang HP) jadi moderator dan tidak ikut bermain.</p>')}
function wwStart(a){const rs=deal(a.length),c={};rs.forEach(r=>c[r]=(c[r]||0)+1);
 G={p:a.map((n,i)=>({id:i,name:n,role:rs[i],alive:true,u:{},parent:null})),night:0,lovers:null,sick:false,cub:false,alphaUsed:false,hq:[],notify:[],D:[]};
 R(`<h2>Peran di game ini</h2><p>Khusus host. Jangan diperlihatkan.</p><div class=card>${Object.keys(c).map(r=>`<div class=row><span>${RL[r][0]}</span><b>${c[r]}</b></div>`).join('')}</div><button class=a onclick=wwReveal()>Bagikan peran (oper HP)</button>`)}

/* ---------- Werewolf: malam ---------- */
function kill(id,cause,info){const p=G.p[id];if(!p||!p.alive)return;p.alive=false;p.death={cause,info:info||'',night:G.night};G.D.push(id);
 if(p.role=='cub')G.cub=true;if(cause=='wolf'&&p.role=='sick'){G.sick=true;G.lock=true}if(p.role=='hunter')G.hq.push(id);
 if(G.lovers&&G.lovers.includes(id))kill(G.lovers.find(x=>x!=id),'love')}
const inf=(t,b)=>done=>{window.nxt=done;R(`<h2>${t}</h2><div class=card>${b}</div><button class=a onclick=nxt()>Lanjut</button>`)};
function night(){G.night++;G.D=[];const first=G.night==1,by=r=>A().filter(p=>p.role==r),oth=p=>A().filter(x=>x.id!=p.id);
 N={jail:null,guard:null,body:null,wolf:[],conv:null,kill:null,heal:null,poi:null,hu:false};const S=[],jl=p=>N.jail===p.id;
 const skip=p=>inf('Ditahan Jailer',`<b>${esc(p.name)}</b> ditahan. Kemampuannya tidak aktif malam ini. Tetap tepuk bahunya supaya tidak ketahuan.`);
 const run=()=>{if(!S.length)return resolve();window.nxt=run;S.shift()(run)};
 S.push(d=>{window.nxt=d;R(`<h2>Malam ${G.night}</h2><p>Semua pemain tutup mata dan menunduk. Host mengikuti langkah berikut dan menepuk bahu pemain yang dipanggil.</p><button class=a onclick=nxt()>Mulai</button><button class=g onclick=quit()>Keluar game</button>`)});
 G.notify.forEach(id=>{const p=G.p[id];if(p.alive)S.push(inf(`Tepuk bahu ${esc(p.name)}`,'Dia diubah Alpha Wolf menjadi <b>Werewolf</b>. Bisikkan atau tunjukkan layar ini, lalu minta dia tutup mata lagi.'))});G.notify=[];
 by('orphan').forEach(o=>{
  if(first&&o.parent===null)return S.push(d=>pick(`Tepuk bahu ${esc(o.name)} (Orphan)`,'Dia memilih Parent-nya.',oth(o),1,s=>{o.parent=s[0];run()}));
  const pr=G.p[o.parent];
  if(pr&&!pr.alive){const nr=RL[pr.role][1]=='V'&&pr.role!='orphan'?pr.role:'villager';o.role=nr;o.u={};
   S.push(inf(`Tepuk bahu ${esc(o.name)}`,`Parent (${esc(pr.name)}) sudah mati. Peran barunya: <b>${RL[nr][0]}</b>, kemampuan baru dari awal.<p>${RL[nr][2]}</p>`))}
  else S.push(inf(`Tepuk bahu ${esc(o.name)}`,'Parent masih hidup. Tidak ada perubahan.'))});
 if(first){by('cupid').forEach(c=>S.push(d=>pick(`Tepuk bahu ${esc(c.name)} (Cupid)`,'Pilih 1 pemain sebagai pasangannya.',oth(c),1,s=>{G.lovers=[c.id,s[0]];inf('Lovers',`Tepuk bahu <b>${esc(c.name)}</b> dan <b>${esc(G.p[s[0]].name)}</b>. Mereka saling kenal, lalu tutup mata lagi.`)(run)})));
  const ws=A().filter(p=>SW.includes(p.role)).map(p=>esc(p.name)).join(', '),mn=by('minion').map(p=>esc(p.name)).join(', ');
  S.push(inf('Serigala saling kenal',`Serigala buka mata: <b>${ws}</b>.${mn?`<br>Lalu tepuk Minion (<b>${mn}</b>) dan tunjukkan siapa serigalanya.`:''}`))}
 by('jailer').forEach(j=>S.push(d=>pick(`Jailer: ${esc(j.name)}`,'Tahan 1 pemain.',A(),1,s=>{N.jail=s[0];run()})));
 by('guardian').forEach(g=>S.push(d=>jl(g)?skip(g)(d):pick(`Guardian: ${esc(g.name)}`,'Lindungi 1 pemain (boleh diri sendiri).',A(),1,s=>{N.guard=s[0];run()})));
 by('bodyguard').forEach(b=>S.push(d=>jl(b)?skip(b)(d):pick(`Bodyguard: ${esc(b.name)}`,'Jaga 1 pemain (bukan diri sendiri).',oth(b),1,s=>{N.body={by:b.id,t:s[0]};run()})));
 by('seer').forEach(x=>S.push(d=>jl(x)?skip(x)(d):pick(`Seer: ${esc(x.name)}`,'Cek 1 pemain.',oth(x),1,s=>{const t=G.p[s[0]];inf('Hasil Seer',`<b>${esc(t.name)}</b> adalah <b>${SW.includes(t.role)?'Wolf':'Not Wolf'}</b>. Tunjukkan layar ini ke Seer.`)(run)})));
 by('ghost').forEach(x=>S.push(d=>{if(jl(x))return skip(x)(d);const dd=G.p.filter(p=>!p.alive);if(!dd.length)return inf(`Ghost Whisperer: ${esc(x.name)}`,'Belum ada yang mati.')(d);
  pick(`Ghost Whisperer: ${esc(x.name)}`,'Pilih 1 pemain yang sudah mati.',dd,1,s=>inf('Hasil Ghost Whisperer',`<b>${esc(G.p[s[0]].name)}</b> adalah <b>${RL[G.p[s[0]].role][0]}</b>. Tunjukkan layar ini ke dia.`)(run))}));
 if(A().some(p=>SW.includes(p.role)))S.push(d=>{
  if(G.sick){G.sick=false;return inf('Giliran serigala','Serigala buka mata, tapi <b>sakit perut</b> malam ini: tidak bisa membunuh siapa pun.')(d)}

 by('killer').forEach(k=>S.push(d=>pick(`Killer: ${esc(k.name)}`,'Pilih 1 korban.',oth(k),1,s=>{N.kill=s[0];run()})));
 by('witch').forEach(w=>S.push(d=>{if(jl(w))return skip(w)(d);

function resolve(){const P=[N.jail,N.guard];let bg=N.body&&G.p[N.body.by].alive?N.body:null;

 const hit=(t,src)=>{const p=G.p[t];if(!p.alive||(src=='wolf'&&p.role=='killer')||P.includes(t))return;if(bg&&bg.t==t){const b=bg.by;bg=null;kill(b,'bg');return}kill(t,src)};
 N.wolf.forEach(t=>{if(t===N.conv){if(!prot(t)&&G.p[t].alive){G.p[t].role='werewolf';G.p[t].u={};G.alphaUsed=true;G.notify.push(t)}return}if(t!==N.heal)hit(t,'wolf')});
 if(N.kill!==null)hit(N.kill,'kill');
 if(N.poi!==null&&!P.includes(N.poi))kill(N.poi,'witch');
 hunters(dawn)}
function hunters(cb){if(!G.hq.length)return cb();const h=G.p[G.hq.shift()];
 pick(`Hunter ${esc(h.name)} mati`,'Pilih pemain yang ditembak.',A(),1,s=>{
  if(!s)return hunters(cb);

function win(){const al=A(),W=al.filter(isWN).length,K=al.filter(p=>p.role=='killer').length,O=al.length-W-K;
 if(al.length==2&&G.lovers&&al.every(p=>G.lovers.includes(p.id)))return'Lovers';
 if(!al.length)return'Tidak ada';if(!W&&!K)return'Village';if(K&&al.length==1)return'Killer';if(!K&&W>=O)return'Wolf Team';return null}

function dangerMsg(){const al=A(),W=al.filter(isWN).length,K=al.filter(p=>p.role=='killer').length,O=al.length-W-K;

function exec(){const a=A(),t={};a.forEach(p=>t[p.id]=(V[p.id]||0)+(V.mv==p.id?1:0));const mx=Math.max(...Object.values(t)),top=a.filter(p=>t[p.id]==mx);

 hunters(()=>{const w=win();
  R(`<h2>${esc(p.name)} dieksekusi</h2><div class=card>Perannya: <b>${RL[p.role][0]}</b>${G.D.length>1?'<br>Ikut mati: <b>'+G.D.slice(1).map(i=>esc(G.p[i].name)).join(', ')+'</b>':''}</div>${w?`<div class=card style="border-color:var(--blue)"><b>🏆 Game selesai — ${w=='Tidak ada'?'semua tumbang':w+' menang!'}</b></div><button class=a onclick="end('${w}')">Lihat hasil akhir</button>`:`<button class=a onclick=night()>Lanjut ke malam</button>`}`)})}

 });

 const wolves=al.filter(p=>SW.includes(p.role)),killer=al.find(p=>p.role=='killer'),guardian=al.find(p=>p.role=='guardian'),cupid=al.find(p=>p.role=='cupid');

 if(killer)pre+=`<div class=card><b>🔪 Killer: ${esc(killer.name)}</b><p>Pilih korban Killer:</p>${cl('kill',al.filter(p=>p.id!=killer.id),'naToggle')}</div>`;
 if(guardian)pre+=`<div class=card><b>🛡️ Guardian: ${esc(guardian.name)}</b><p>Pilih 1 pemain yang dilindungi (boleh diri sendiri):</p>${cl('guard',al,'naPick')}</div>`;
 if(cupid&&!G.lovers)pre+=`<div class=card><b>💘 Cupid: ${esc(cupid.name)}</b><p>Pilih 1 pemain sebagai pasangannya (Lovers). Rahasia, hanya tunjukkan ke Cupid.</p>${cl('link',al.filter(p=>p.id!=cupid.id),'naLink')}${NA.link!=null?`<p>Pasangan terpilih: <b>${esc(G.p[NA.link].name)}</b></p>`:''}</div>`;

let DIP=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIos=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function showInstallBar(){if(isStandalone())return;const b=$('#installBar');if(b)b.style.display='flex'}
function hideInstallBar(){const b=$('#installBar');if(b)b.style.display='none'}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DIP=e;showInstallBar()});
addEventListener('appinstalled',hideInstallBar);
if(!isStandalone()&&isIos())showInstallBar();
const installBtnEl=$('#installBtn');
if(installBtnEl)installBtnEl.onclick=async()=>{
 if(DIP){DIP.prompt();await DIP.userChoice;DIP=null;hideInstallBar();return}
 if(isIos()){const d=document.createElement('div');d.className='qd';
  d.innerHTML='<div class=qbox><h2>📲 Pasang di iPhone/iPad</h2><p>Tap ikon <b>Share</b> (kotak dengan panah ke atas) di Safari, lalu pilih <b>"Add to Home Screen"</b>.</p><button class=a id=okb>Mengerti</button></div>';
  document.body.appendChild(d);$('#okb').onclick=()=>d.remove()}
};

function one(n){const p=n.parentNode;if(!p||/^(TEXTAREA|SCRIPT|STYLE)$/.test(p.nodeName))return;
 if(n.__o===undefined)n.__o=n.nodeValue;const v=LANG=='en'?trs(n.__o):n.__o;if(n.nodeValue!==v)n.nodeValue=v}
function walk(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(one);
 root.querySelectorAll('[placeholder]').forEach(e=>{if(e.__p===undefined)e.__p=e.getAttribute('placeholder');e.setAttribute('placeholder',LANG=='en'?trs(e.__p):e.__p)})}
const OBO={childList:true,subtree:true,characterData:true};

 ms.forEach(m=>{if(m.type=='characterData'){m.target.__o=undefined;one(m.target)}else m.addedNodes.forEach(n=>{if(n.nodeType==3)one(n);else if(n.nodeType==1)walk(n)})});
 OB.observe(document.body,OBO)});
